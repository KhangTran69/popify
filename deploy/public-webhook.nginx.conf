# Example public TLS ingress: only the signed Shopify webhook is reachable.
# Operator console and n8n must use separately protected private access.
worker_processes auto;
events { worker_connections 256; }
http {
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_req_zone $binary_remote_addr zone=shop_ip:10m rate=10r/s;
    limit_req_zone $server_name zone=shop_total:1m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_conn_zone $server_name zone=conn_total:1m;
    limit_req_status 429;
    limit_conn_status 429;
    log_format safe '$request_method $status $request_time';
    access_log /dev/stdout safe;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1000000;
        location = /webhooks/shopify/orders {
            limit_except POST { deny all; }
            limit_req zone=shop_ip burst=20 nodelay;
            limit_req zone=shop_total burst=100 nodelay;
            limit_conn conn_ip 10;
            limit_conn conn_total 64;
            proxy_request_buffering on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
            proxy_send_timeout 15s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://api:8000;
        }
        location / { return 404; }
    }
}
