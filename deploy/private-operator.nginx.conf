# Private loopback-only operator ingress; no public webhook or internal worker routes.
worker_processes auto;
events { worker_connections 256; }
http {
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    client_max_body_size 128k;
    map $request_method $login_key { default ""; POST $binary_remote_addr; }
    limit_req_zone $login_key zone=login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=operator_conn:10m;
    limit_conn_zone $server_name zone=operator_total:1m;
    limit_req_zone $server_name zone=operator_rate:1m rate=100r/s;
    limit_req_status 429;
    limit_conn_status 429;
    log_format safe '$request_method $status $request_time';
    access_log /dev/stdout safe;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn operator_conn 20;
        limit_conn operator_total 64;
        limit_req zone=operator_rate burst=100 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Default deny: adding an API route does not automatically expose it.
        location = /login {
            limit_req zone=operator_rate burst=100 nodelay;
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api:8000;
        }
        location ~ ^/(|live|ready|operations|api/ops/status|logout|operators|recovery|support)$ {
            proxy_pass http://api:8000;
        }
        location ~ ^/(queues/[^/]+|operators/[a-z][a-z0-9_.-]+|orders/[0-9]+|cases/[0-9]+(/retry)?|deliveries/[0-9]+(/retry)?|approvals/[0-9]+(/(decision|refresh|reconcile|retry))?)$ {
            proxy_pass http://api:8000;
        }
        location /static/ { proxy_pass http://api:8000; }
        location / { return 404; }
    }
}
