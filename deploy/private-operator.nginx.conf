# Private loopback-only operator ingress; no public webhook or internal worker routes.
worker_processes auto;
events { worker_connections 256; }
http {
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    client_max_body_size 128k;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=operator_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    log_format safe '$request_method $status $request_time';
    access_log /dev/stdout safe;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn operator_conn 20;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        location ~ ^/(webhooks|api/n8n|api/support|api/demo|demo|docs|redoc|openapi\.json)(/|$) { return 404; }
        location = /login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api:8000;
        }
        location / { proxy_pass http://api:8000; }
    }
}
