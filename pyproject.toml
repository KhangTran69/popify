[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "commerceops"
version = "0.1.0"
description = "Mock-first e-commerce order and support automation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.1", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.8", "psycopg[binary]==3.3.8", "jinja2==3.1.6", "python-multipart==0.0.33", "httpx==0.28.1", "itsdangerous==2.2.0", "pydantic-settings==2.16.2"
]
[project.optional-dependencies]
test = ["pytest==9.2.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
