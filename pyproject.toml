[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "commerceops"
version = "0.1.0"
description = "Mock-first e-commerce order and support automation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.6", "jinja2==3.1.6", "python-multipart==0.0.32", "httpx==0.28.1", "itsdangerous==2.2.0", "pydantic-settings==2.16.1"
]
[project.optional-dependencies]
test = ["pytest==8.4.2"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
